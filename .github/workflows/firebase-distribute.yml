name: Build & Distribute APK to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for testers"
        required: false
        default: "Manual build"

permissions:
  contents: write

jobs:
  build:
    name: Build and Distribute to Firebase
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      DEBUG_MODE: false

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      - name: 💎 Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: 💾 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: 🧩 Set Gradle Properties
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: 🧹 Clean Gradle Cache (to avoid Kotlin 2.1.0 artifacts)
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/
          rm -rf ~/.gradle/native/
          rm -rf ~/.gradle/wrapper/

      - name: 📦 Install Node Modules & Verify Plugin Resolution
        run: |
          npm install --legacy-peer-deps
          echo "✅ react-native path:"
          node --print "require.resolve('react-native/package.json')"
          echo "✅ gradle-plugin path:"
          node --print "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
          echo "✅ expo path (optional):"
          node --print "require.resolve('expo/package.json')" || echo "expo not found"

      - name: 🔐 Inject Google Maps API Key to .env
        run: |
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > .env

      - name: 🧪 Check .env Contents (DEBUG ONLY)
        if: env.DEBUG_MODE == 'true'
        run: cat .env

      - name: 📦 Install Fastlane Dependencies
        working-directory: android
        run: bundle install

      - name: 🔐 Prepare Firebase App Distribution Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            python - <<'PY'
            import base64
            import json
            import os
            from pathlib import Path

            raw_value = os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"].strip()
            try:
              credentials = json.loads(raw_value)
            except json.JSONDecodeError:
              try:
                credentials = json.loads(base64.b64decode(raw_value).decode("utf-8"))
              except Exception as exc:
                raise SystemExit(
                  "FIREBASE_SERVICE_ACCOUNT_JSON must be valid JSON or a base64-encoded JSON document."
                ) from exc

            credentials_path = Path(os.environ["RUNNER_TEMP"]) / "firebase-service-account.json"
            credentials_path.write_text(json.dumps(credentials))
            for field in ("private_key", "private_key_id", "client_email", "client_id"):
              value = credentials.get(field)
              if value:
                print(f"::add-mask::{value}")
            print(f"::add-mask::{raw_value}")

            github_env = Path(os.environ["GITHUB_ENV"])
            with github_env.open("a") as env_file:
              env_file.write(f"GOOGLE_APPLICATION_CREDENTIALS={credentials_path}\n")
              env_file.write(f"FIREBASE_CREDENTIALS_FILE={credentials_path}\n")
            PY
            echo "Using Firebase service account credentials."
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> "$GITHUB_ENV"
            echo "Using legacy Firebase CLI token."
          else
            echo "::error::Missing Firebase App Distribution credentials. Set FIREBASE_SERVICE_ACCOUNT_JSON (recommended) or FIREBASE_TOKEN."
            exit 1
          fi

      - name: 🛠 Fix Gradlew Permission
        run: chmod +x android/gradlew

      - name: 🧪 Run Kotlin Compilation Check with Debug Logs
        working-directory: android
        run: |
          echo "🧪 Running Kotlin compile diagnostics..."
          ./gradlew assembleRelease --stacktrace --info || true

      - name: 🚀 Distribute via Fastlane
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'Push build' }}
        run: bundle exec fastlane beta release_notes:"$RELEASE_NOTES"

      - name: Upload APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          artifacts: android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            🚀 Automatic release for build run #${{ github.run_number }}
