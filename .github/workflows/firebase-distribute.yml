name: Build & Distribute APK to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for testers"
        required: false
        default: "Manual build"

permissions:
  contents: write

jobs:
  build:
    name: Build and Distribute to Firebase
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      DEBUG_MODE: false

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      - name: 💎 Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: 💾 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: 🧩 Set Gradle Properties
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: 🧹 Clean Gradle Cache (to avoid Kotlin 2.1.0 artifacts)
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/
          rm -rf ~/.gradle/native/
          rm -rf ~/.gradle/wrapper/

      - name: 📦 Install Node Modules & Verify Plugin Resolution
        run: |
          npm install --legacy-peer-deps
          echo "✅ react-native path:"
          node --print "require.resolve('react-native/package.json')"
          echo "✅ gradle-plugin path:"
          node --print "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
          echo "✅ expo path (optional):"
          node --print "require.resolve('expo/package.json')" || echo "expo not found"

      - name: 🔐 Inject Google Maps API Key to .env
        run: |
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > .env

      - name: 🧪 Check .env Contents (DEBUG ONLY)
        if: env.DEBUG_MODE == 'true'
        run: cat .env

      - name: 📦 Install Fastlane Dependencies
        working-directory: android
        run: bundle install

      - name: 🔐 Prepare Firebase App Distribution Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            python3 .github/scripts/prepare_firebase_credentials.py
            echo "FIREBASE_USE_LEGACY_TOKEN=false" >> "$GITHUB_ENV"
            echo "Using Google credentials from FIREBASE_SERVICE_ACCOUNT_JSON."
          elif [ -n "$FIREBASE_TOKEN" ]; then
            token_is_google_credentials_json=false
            if printf '%s' "$FIREBASE_TOKEN" | python3 .github/scripts/is_firebase_service_account_payload.py; then
              token_is_google_credentials_json=true
            else
              decoded_token_file="$(mktemp)"
              if printf '%s' "$FIREBASE_TOKEN" | base64 --decode > "$decoded_token_file" 2>/dev/null; then
                if [ -s "$decoded_token_file" ] && python3 .github/scripts/is_firebase_service_account_payload.py < "$decoded_token_file"; then
                  FIREBASE_TOKEN="$(cat "$decoded_token_file")"
                  token_is_google_credentials_json=true
                else
                  echo "FIREBASE_TOKEN was decoded from base64 but is not supported Google credentials JSON; trying legacy token auth."
                fi
              else
                echo "FIREBASE_TOKEN is not valid base64; trying legacy token auth."
              fi
              rm -f "$decoded_token_file"
            fi

            if [ "$token_is_google_credentials_json" = true ]; then
              export FIREBASE_SERVICE_ACCOUNT_JSON="$FIREBASE_TOKEN"
              python3 .github/scripts/prepare_firebase_credentials.py
              echo "FIREBASE_USE_LEGACY_TOKEN=false" >> "$GITHUB_ENV"
              echo "Detected Google credentials JSON in FIREBASE_TOKEN and prepared application credentials."
            else
              echo "FIREBASE_TOKEN is not in supported Google credentials JSON format; using legacy Firebase CLI token."
              echo "FIREBASE_USE_LEGACY_TOKEN=true" >> "$GITHUB_ENV"
            fi
          else
            echo "::error::Missing Firebase App Distribution credentials. Set FIREBASE_SERVICE_ACCOUNT_JSON (recommended) or FIREBASE_TOKEN (legacy refresh token or base64/raw Google credentials JSON) in repository settings."
            exit 1
          fi

      - name: 🛠 Fix Gradlew Permission
        run: chmod +x android/gradlew

      - name: 🧪 Run Kotlin Compilation Check with Debug Logs
        working-directory: android
        run: |
          echo "🧪 Running Kotlin compile diagnostics..."
          ./gradlew assembleRelease --stacktrace --info || true

      - name: 🚀 Distribute via Fastlane
        working-directory: android
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'Push build' }}
        run: |
          if [ "${FIREBASE_USE_LEGACY_TOKEN:-false}" = "true" ]; then
            export FIREBASE_TOKEN="${{ secrets.FIREBASE_TOKEN }}"
          else
            unset FIREBASE_TOKEN
          fi
          bundle exec fastlane beta release_notes:"$RELEASE_NOTES"

      - name: Upload APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          artifacts: android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            🚀 Automatic release for build run #${{ github.run_number }}
